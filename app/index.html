\</head> \<body>     \<div class="container">         \<h2>Greatest of Three Numbers-version 2\</h2>

```
    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">
    <input type="number" id="num3" placeholder="Enter third number">

    <button onclick="findGreatest()">Find Greatest</button>

    <p id="result"></p>
</div>

<script>
    function findGreatest() {
        const a = Number(document.getElementById("num1").value);
        const b = Number(document.getElementById("num2").value);
        const c = Number(document.getElementById("num3").value);

        if (
            document.getElementById("num1").value === "" ||
            document.getElementById("num2").value === "" ||
            document.getElementById("num3").value === ""
        ) {
            document.getElementById("result").textContent =
                "Please enter all three numbers.";
            return;
        }

        document.getElementById("result").textContent =
            "Greatest number: " + Math.max(a, b, c);
    }
</script>
