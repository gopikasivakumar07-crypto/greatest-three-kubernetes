apiVersion: apps/v1
kind: Deployment
metadata:
  name: greatest-three-set14
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greatest-three-set14
  template:
    metadata:
      labels:
        app: greatest-three-set14
    spec:
      containers:
        - name: greatest-three-container
          image: greatest-three:set14
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80