apiVersion: apps/v1
kind: Deployment
metadata:
  name: greatest-three-set13
spec:
  replicas: 2
  selector:
    matchLabels:
      app: greatest-three-set13
  template:
    metadata:
      labels:
        app: greatest-three-set13
    spec:
      containers:
        - name: greatest-three-container
          image: greatest-three:set12
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80